<!doctype html><html><head><meta charset="utf-8"><title>Webbit interaction checks</title><style>body{font:15px Segoe UI;background:#edf0f7;color:#263246;padding:24px}button{padding:10px;margin:6px}iframe{width:820px;height:360px;border:1px solid #bac4d3;background:white}li{margin:8px}#status{font-weight:bold}</style></head><body><h1>Webbit interaction checks</h1><p>Disposable fixture. Tests send pointer events through the real canvas controller and verify selection, source edits and navigation callbacks.</p><button id="run">Run interaction checks</button><button id="box">Show an Alt selection box</button><p id="status">Ready</p><ol id="results"></ol><div id="paper"><iframe id="fixture" title="Disposable canvas fixture" sandbox="allow-same-origin"></iframe></div><script type="module">
import {attachCanvas} from '/src/canvas.ts';
import {previewDocument} from '/src/preview.ts';
import {editCanvasSelection} from '/src/canvas-edit.ts';
const fixture=document.querySelector('#fixture'),status=document.querySelector('#status'),results=document.querySelector('#results');
const html=`<!doctype html><html><head><style>body{margin:0;min-height:360px}header{height:120px;position:relative}button,a{position:absolute;top:40px;width:100px;height:40px;box-sizing:border-box}#a{left:40px}#b{left:200px}#link{left:400px}main{height:240px;padding:30px}#hidden{display:none}</style></head><body><header><button id="a"><span>Alpha</span></button><button id="b">Beta</button><a id="link" href="about.html">About</a></header><main><p id="text">Visible text</p><button id="hidden">Hidden</button></main></body></html>`;
let d,cleanup,source,lastEdit,lastSource,followed,draws=0;
const assert=(value,message)=>{if(!value)throw Error(message);};
const selected=()=>Array.from(d.querySelectorAll('[data-webbit-canvas-selected]')).map(el=>el.id);
const id=name=>Number(d.getElementById(name).dataset.webbitNode);
async function load({group=false,drawing=false}={}){cleanup?.();source=group?html.replace('id="a"','id="a" data-wb-group="pair"').replace('id="b"','id="b" data-wb-group="pair"'):html;lastEdit=null;lastSource=source;followed=null;draws=0;await new Promise(resolve=>{fixture.onload=()=>{d=fixture.contentDocument;cleanup=attachCanvas(d,{tool:'move',markup:drawing?'<button>New</button>':null,onEdit:edit=>{lastEdit=edit;lastSource=editCanvasSelection(source,edit).source;},onSelect:()=>{},onDeselect:()=>{},onDraw:()=>draws++,onMove:()=>{},onResize:()=>{},onError:message=>{throw Error(message);},onFollowLink:href=>followed=href});resolve();};fixture.srcdoc=previewDocument({files:{'index.html':source},assets:{},entry:'index.html',name:'Fixture'},'index.html');});}
function pointer(type,x,y,keys={}){const target=type==='pointerdown'?(d.elementFromPoint(x,y)??d.body):d.documentElement;target.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:1,pointerType:'mouse',button:0,buttons:type==='pointerup'?0:1,clientX:x,clientY:y,...keys}));}
async function box(start,end,extra={}){pointer('pointerdown',...start,{altKey:true,...extra});pointer('pointermove',...end,{altKey:true,...extra});await new Promise(resolve=>requestAnimationFrame(resolve));pointer('pointerup',...end,{altKey:true,...extra});}
const checks=[
 ['Partial overlap selects two independent buttons',async()=>{await load();await box([30,30],[210,90]);assert(selected().join(',')==='a,b',JSON.stringify(selected()));assert(lastEdit===null,'selection changed source');assert(!d.querySelector('[data-webbit-marquee]'),'box remained after release');}],
 ['Selected elements move together and produce real CSS',async()=>{await load();await box([30,30],[210,90]);pointer('pointerdown',44,44);pointer('pointermove',104,104);pointer('pointerup',104,104);assert(lastEdit?.kind==='move'&&lastEdit.items.length===2,'group movement did not use both objects');assert(lastSource.includes('position:absolute')&&lastSource.includes('data-wb-canvas-id'),'source was not updated');}],
 ['Reverse-direction drawing selects the same objects',async()=>{await load();await box([210,90],[30,30]);assert(selected().join(',')==='a,b',JSON.stringify(selected()));}],
 ['Shift+Alt adds to the current selection',async()=>{await load();pointer('pointerdown',44,44,{shiftKey:true});pointer('pointerup',44,44,{shiftKey:true});await box([205,45],[220,65],{shiftKey:true});assert(selected().join(',')==='a,b',JSON.stringify(selected()));}],
 ['Escape restores the selection from before drawing',async()=>{await load();pointer('pointerdown',44,44,{shiftKey:true});pointer('pointerup',44,44,{shiftKey:true});pointer('pointerdown',205,45,{altKey:true});pointer('pointermove',250,65,{altKey:true});await new Promise(resolve=>requestAnimationFrame(resolve));d.documentElement.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));assert(selected().join(',')==='a','cancel lost prior selection');assert(!d.querySelector('[data-webbit-marquee]'),'cancel left the box');}],
 ['A touched saved group includes its distant members',async()=>{await load({group:true});await box([35,35],[75,65]);assert(selected().join(',')==='a,b',JSON.stringify(selected()));}],
 ['Alt selection works while placing a gallery element',async()=>{await load({drawing:true});await box([30,30],[210,90]);assert(selected().join(',')==='a,b',JSON.stringify(selected()));assert(draws===0,'selection inserted a new element');}],
 ['Ctrl-click follows a link without editing it',async()=>{await load();pointer('pointerdown',410,50,{ctrlKey:true});pointer('pointerup',410,50,{ctrlKey:true});assert(followed==='about.html','link was not followed');assert(lastEdit===null,'link click changed geometry');}],
 ['Ctrl-drag still rotates and does not follow the link',async()=>{await load();pointer('pointerdown',410,50,{ctrlKey:true});pointer('pointermove',460,80,{ctrlKey:true});pointer('pointerup',460,80,{ctrlKey:true});assert(followed===null,'rotation followed link');assert(lastEdit?.kind==='style'&&lastSource.includes('rotate:'),'rotation did not update source');}],
 ['Invisible elements and nested button labels are not separate selections',async()=>{await load();await box([30,30],[310,90]);assert(selected().join(',')==='a,b',JSON.stringify(selected()));}],
 ['An empty selection box clears the selection',async()=>{await load();await box([30,30],[210,90]);await box([600,260],[650,320]);assert(selected().length===0,JSON.stringify(selected()));}],
 ['Pointer cancellation restores the prior selection',async()=>{await load();await box([30,30],[210,90]);pointer('pointerdown',600,130,{altKey:true});pointer('pointermove',650,200,{altKey:true});await new Promise(resolve=>requestAnimationFrame(resolve));d.documentElement.dispatchEvent(new PointerEvent('pointercancel',{bubbles:true,pointerId:1}));assert(selected().join(',')==='a,b',JSON.stringify(selected()));}]
];
document.querySelector('#run').onclick=async()=>{results.replaceChildren();status.textContent='Running';let passed=0;for(const [label,run]of checks){const li=document.createElement('li');try{await run();passed++;li.textContent='PASS: '+label;}catch(error){li.textContent='FAIL: '+label+' — '+error.message;}results.append(li);}status.textContent=passed+' / '+checks.length+' interaction checks passed';};
document.querySelector('#box').onclick=async()=>{await load();pointer('pointerdown',30,30,{altKey:true});pointer('pointermove',210,90,{altKey:true});status.textContent='Alt-drag selection preview: two touched buttons';};
await load();
</script></body></html>
